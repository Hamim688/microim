<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD84D" />
      <stop offset="100%" stop-color="#FFC928" />
    </linearGradient>
    <filter id="circuitGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Mirrored M/I Circuit Emblem -->
  <g transform="translate(10, 10)">
    <!-- Circuit Base Frame -->
    <rect x="0" y="0" width="60" height="60" rx="14" fill="#0c213d" stroke="#1b3b65" stroke-width="1.5" />
    
    <!-- Left M-wing (Geometric Circuit Track) -->
    <path d="M 16 46 L 16 18 L 26 32 L 30 26" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Right Mirrored I/M Circuit Track -->
    <path d="M 44 46 L 44 18 L 34 32 L 30 26" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />
    
    <!-- Center Node Core (Intelligent Microcontroller Point) -->
    <circle cx="30" cy="26" r="3.5" fill="#FFC928" filter="url(#circuitGlow)" />
    
    <!-- Terminal Circuit Nodes -->
    <circle cx="16" cy="46" r="2.5" fill="#FFC928" />
    <circle cx="44" cy="46" r="2.5" fill="#FFFFFF" />
    <circle cx="16" cy="18" r="2" fill="#FFC928" />
    <circle cx="44" cy="18" r="2" fill="#FFFFFF" />

    <!-- Micro Circuit Traces -->
    <line x1="6" y1="30" x2="12" y2="30" stroke="#FFC928" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <line x1="48" y1="30" x2="54" y2="30" stroke="#FFC928" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Typography: MIKROIM -->
  <text x="82" y="44" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.03em" fill="#FFFFFF">
    MIKRO<tspan fill="#FFC928">IM</tspan>
  </text>

  <!-- Tagline / Subtitle -->
  <text x="84" y="60" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" letter-spacing="0.12em" fill="#94A3B8">
    LAB TEKNOLOGI &amp; IoT
  </text>
</svg>
